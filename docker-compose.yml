services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: asmart
      POSTGRES_PASSWORD: asmart
      POSTGRES_DB: asmart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asmart -d asmart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
