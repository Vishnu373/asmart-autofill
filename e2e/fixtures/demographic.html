<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Add a Demographic Record</title>
  </head>
  <body>
    <h1>Add a Demographic Record</h1>
    <form name="addDemographic" method="post" action="/oscar/demographic/addDemographic.do">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" name="last_name" />

      <label for="firstName">First Name</label>
      <input type="text" id="firstName" name="first_name" />

      <label for="preferredName">Preferred Name</label>
      <input type="text" id="preferredName" name="preferred_name" />

      <label for="address">Address</label>
      <input type="text" id="address" name="address" />

      <label for="city">City</label>
      <input type="text" id="city" name="city" />

      <label for="province">Province</label>
      <select id="province" name="province">
        <option value=""></option>
        <option value="AB">Alberta</option>
        <option value="BC">British Columbia</option>
        <option value="MB">Manitoba</option>
        <option value="NB">New Brunswick</option>
        <option value="NL">Newfoundland and Labrador</option>
        <option value="NS">Nova Scotia</option>
        <option value="NT">Northwest Territories</option>
        <option value="NU">Nunavut</option>
        <option value="ON">Ontario</option>
        <option value="PE">Prince Edward Island</option>
        <option value="QC">Quebec</option>
        <option value="SK">Saskatchewan</option>
        <option value="YT">Yukon</option>
      </select>

      <label for="postal">Postal Code</label>
      <input type="text" id="postal" name="postal_code" />

      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" />

      <label for="email">Email</label>
      <input type="text" id="email" name="email" />

      <label for="dateOfBirth">Date of Birth</label>
      <input type="text" id="dateOfBirth" name="date_of_birth" />

      <label for="hin">Health Insurance Number</label>
      <input type="text" id="hin" name="hin" />

      <label for="ver">Version Code</label>
      <input type="text" id="ver" name="ver" />

      <label for="hcType">Health Card Type</label>
      <select id="hcType" name="hc_type">
        <option value=""></option>
        <option value="AB">AB</option>
        <option value="BC">BC</option>
        <option value="MB">MB</option>
        <option value="NB">NB</option>
        <option value="NL">NL</option>
        <option value="NS">NS</option>
        <option value="NT">NT</option>
        <option value="NU">NU</option>
        <option value="ON">ON</option>
        <option value="PE">PE</option>
        <option value="QC">QC</option>
        <option value="SK">SK</option>
        <option value="YT">YT</option>
        <option value="OTHER">Other</option>
      </select>

      <input type="submit" value="Add Record" />
    </form>
  </body>
</html>
